---
# Root Specification Manifest
# This file defines the complete category-based spec system structure
# This is the CANONICAL source of truth for tier hierarchy and precedence.
# All other files (_categories.yaml, constitution, spec-system/spec.md) derive from this.
#
# Specification: platform/002-category-based-spec-system/spec.md
# Created: 2026-02-07
# Updated: 2026-03-16
# Version: 2.0.0

metadata:
  name: "Category-Based Specification System"
  version: "2.0.0"
  description: "Root manifest defining all tiers, categories, precedence rules, authority scopes, and execution modes"
  created: "2026-02-07"
  updated: "2026-03-16"
  owner: "Platform Engineering Team"
  status: "active"

# ============================================================================
# CANONICAL TIER HIERARCHY (ordered by precedence: top = highest priority)
#
# Tier cascade: platform > business > security > infrastructure > devops > application
#
# Platform tier is FOUNDATIONAL. It defines the spec system, code quality,
# artifact structure, and policy enforcement that ALL other tiers must follow.
# Platform standards are non-negotiable technical foundations.
# ============================================================================
tiers:
  - tier: platform
    name: "Platform Tier"
    description: "Foundational platform standards (spec system, linting, artifact org, policy-as-code, transcript-ingestion)"
    priority: 0
    categories: 5
    authority-scope: platform-meta-governance | platform-content-standards
    authority-note: >
      Platform has dual scope:
      (a) platform-meta-governance: Framework control (.specify/, .github/, constitution,
          templates, tier definitions). SUPERSEDES ALL TIERS. Cannot be overridden.
      (b) platform-content-standards: Content-tier specs (spec-system, iac-linting,
          artifact-org, policy-as-code). Highest content tier (priority 0).
          Participates in normal cascade but is not overridden by lower tiers.

  - tier: business
    name: "Business Tier"
    description: "Business-level decisions (cost, governance, compliance)"
    priority: 1
    categories: 0
    authority-scope: content
    
  - tier: security
    name: "Security Tier"
    description: "Security-level requirements (access control, data protection, audit)"
    priority: 2
    categories: 0
    authority-scope: content
    
  - tier: infrastructure
    name: "Infrastructure Tier"
    description: "Infrastructure-level standards (compute, networking, storage, CI/CD, IaC modules)"
    priority: 3
    categories: 0
    authority-scope: content
    
  - tier: devops
    name: "DevOps Tier"
    description: "Deployment automation, observability, environment management, CI/CD orchestration"
    priority: 4
    categories: 0
    authority-scope: content

  - tier: application
    name: "Application Tier"
    description: "Application-level specifications (individual applications using upstream specs)"
    priority: 5
    categories: null
    authority-scope: content

# Override mechanism: emergency changes that bypass normal cascade
override-policy:
  allowed: true
  requires:
    - declared-role: platform
    - authority-scope: platform-meta-governance
    - justification: "Mandatory written justification citing emergency condition"
    - audit-entry: "Override must be logged with timestamp, actor, justification, and affected specs"
  note: "Only platform-meta-governance authority can invoke emergency overrides. All overrides are auditable and time-limited."
  script-enforced-bypass: "Emergency overrides CANNOT bypass script-enforced execution mode. Scripts must still run; only their inputs/thresholds may be overridden with audit justification."

# ============================================================================
# EXECUTION MODE POLICY (Platform-Meta Governance)
#
# Execution mode is inferred from file type — no per-file declaration needed:
#   .ps1 files under .specify/scripts/  → script-enforced (deterministic)
#   .md  files under .specify/templates/ → spec-interpreted (guided variation)
#
# This policy is owned by platform-meta-governance and cannot be overridden.
#
# script-enforced (.ps1):
#   - Output shape is deterministic and non-interpretable
#   - Must expose: -Json (machine output), -Help (usage)
#   - Must perform prerequisite checks before mutations
#   - Must exit non-zero on failures
#   - Must be idempotent for identical inputs
#
# spec-interpreted (.md templates):
#   - AI/user interpretation is allowed within template constraints
#   - Template provides structure, placeholders, and governance guardrails
#   - Output shape varies by context (that's the point)
#
# Decision rule: If output must always be consistent and non-interpretable,
# implement as a script. If output benefits from variation, use a template.
# ============================================================================
execution-mode-policy:
  authority: platform-meta-governance
  mode-inference:
    script-enforced: ".ps1 files under .specify/scripts/"
    spec-interpreted: ".md files under .specify/templates/"
    note: "Mode is determined by file type and location. No per-file declaration required."

  script-enforced-requirements:
    interface-standard:
      - "Predictable CLI parameters (-Json, -Help, explicit required args)"
      - "Deterministic machine-readable output mode via -Json"
      - "Prerequisite checks before any mutation"
      - "Explicit non-zero exit on gate failures"
      - "Idempotent rerun behavior for identical inputs"
    contracts:
      - deterministic-input: "Documented input parameters with types and validation"
      - deterministic-output: "Known output shape (file writes, JSON, exit codes)"
      - idempotency: "Same inputs produce same outputs; no side effects on rerun"
      - validation: "Self-validates inputs and preconditions before acting"

  # Classification matrix: documents purpose and contracts for each component.
  # Mode is implicit from file type — scripts are enforced, templates are interpreted.
  toolkit-components:
    scripts:
      common.ps1:
        purpose: "Shared helper functions (repo root, branch detection, git checks)"
        contracts: { input: "none (library)", output: "function definitions", idempotent: true }

      create-new-feature.ps1:
        purpose: "Deterministic feature branch and directory scaffolding"
        contracts: { input: "feature description, optional short-name/number", output: "branch + directory created", idempotent: true }

      setup-plan.ps1:
        purpose: "Copy plan template to feature directory"
        contracts: { input: "feature path", output: "plan.md file created", idempotent: true }

      setup-application-artifacts.ps1:
        purpose: "Create/validate application artifact directory structure"
        contracts: { input: "app-name, spec-tier", output: "directory structure created/validated", idempotent: true }

      check-prerequisites.ps1:
        purpose: "Prerequisite gate checks before downstream operations"
        contracts: { input: "feature context", output: "pass/fail with -Json/-PathsOnly modes", idempotent: true }

      update-agent-context.ps1:
        purpose: "Update agent context files from plan data"
        contracts: { input: "plan file path", output: "agent context file updated", idempotent: true }

      register-application.ps1:
        purpose: "Register new application in _index.yaml registry"
        contracts: { input: "app-id, app-name, description", output: "registry entry added", idempotent: true }

      validate-registry.ps1:
        purpose: "CI-friendly registry integrity validation"
        contracts: { input: "none (reads registry)", output: "pass/fail with -Json mode", idempotent: true }

      validate-spec-versions.ps1:
        purpose: "Detects version drift between downstream specs and upstream dependency pins"
        contracts: { input: "none (scans specs/)", output: "drift report with -Json mode", idempotent: true }

      validate-execution-modes.ps1:
        purpose: "CI gate verifying toolkit components are registered and scripts meet interface standard"
        contracts: { input: "none (scans .specify/)", output: "pass/fail with -Json mode", idempotent: true }

      register-category.ps1:
        purpose: "Register a new category in tier _categories.yaml and increment specs.yaml category-count"
        contracts: { input: "-Tier, -CategoryName, -SpecId, -Description", output: "_categories.yaml updated, specs.yaml count incremented", idempotent: true }

      write-spec.ps1:
        purpose: "Write a spec.md file with validated frontmatter, mandatory field enforcement, and conflict-flag injection"
        contracts: { input: "-Tier, -Category, -SpecId, -FrontmatterJson, -BodyMarkdown [-Force]", output: "spec.md written (exit 0), skipped (exit 2), or error (exit 1)", idempotent: true }

    templates:
      spec-template.md:
        purpose: "Structured guidance for specification authoring"
        interpretation-zones: "user scenarios, acceptance criteria, description, hierarchy references"

      plan-template.md:
        purpose: "Structured guidance for implementation planning"
        interpretation-zones: "technical context, design decisions, phase breakdown, risk assessment"

      tasks-template.md:
        purpose: "Structured guidance for task generation"
        interpretation-zones: "task descriptions, effort estimates, dependency ordering"

      checklist-template.md:
        purpose: "Structured guidance for review checklists"
        interpretation-zones: "checklist items, acceptance gates, review criteria"

      agent-file-template.md:
        purpose: "Structured guidance for agent context files"
        interpretation-zones: "agent instructions, context summaries, role directives"

      transcript-analysis-template.md:
        purpose: "Tier signal vocabulary and extraction algorithm for the transcript-to-specs agent"
        interpretation-zones: "signal keyword matching, disambiguation, gap identification, grouping plan presentation"

# Category tree structure
# The version field on each entry is the AUTHORITATIVE latest published version for that spec.
# This is the reference used by validate-spec-versions.ps1 for drift detection.
# When a spec file version is bumped, update the version here in the same commit.
