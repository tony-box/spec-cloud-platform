---
# Root Specification Manifest
# This file defines the complete category-based spec system structure
# This is the CANONICAL source of truth for tier hierarchy and precedence.
# All other files (_categories.yaml, constitution, spec-system/spec.md) derive from this.
#
# Specification: platform/002-category-based-spec-system/spec.md
# Created: 2026-02-07
# Updated: 2026-03-16
# Version: 2.0.0

metadata:
  name: "Category-Based Specification System"
  version: "2.0.0"
  description: "Root manifest defining all tiers, categories, precedence rules, authority scopes, and execution modes"
  created: "2026-02-07"
  updated: "2026-03-16"
  owner: "Platform Engineering Team"
  status: "active"

# ============================================================================
# CANONICAL TIER HIERARCHY (ordered by precedence: top = highest priority)
#
# Tier cascade: platform > business > security > infrastructure > devops > application
#
# Platform tier is FOUNDATIONAL. It defines the spec system, code quality,
# artifact structure, and policy enforcement that ALL other tiers must follow.
# Platform standards are non-negotiable technical foundations.
# ============================================================================
tiers:
  - tier: platform
    name: "Platform Tier"
    description: "Foundational platform standards (spec system, linting, artifact org, policy-as-code)"
    priority: 0
    categories: 4
    authority-scope: platform-meta-governance | platform-content-standards
    authority-note: >
      Platform has dual scope:
      (a) platform-meta-governance: Framework control (.specify/, .github/, constitution,
          templates, tier definitions). SUPERSEDES ALL TIERS. Cannot be overridden.
      (b) platform-content-standards: Content-tier specs (spec-system, iac-linting,
          artifact-org, policy-as-code). Highest content tier (priority 0).
          Participates in normal cascade but is not overridden by lower tiers.

  - tier: business
    name: "Business Tier"
    description: "Business-level decisions (cost, governance, compliance)"
    priority: 1
    categories: 3
    authority-scope: content
    
  - tier: security
    name: "Security Tier"
    description: "Security-level requirements (access control, data protection, audit)"
    priority: 2
    categories: 3
    authority-scope: content
    
  - tier: infrastructure
    name: "Infrastructure Tier"
    description: "Infrastructure-level standards (compute, networking, storage, CI/CD, IaC modules)"
    priority: 3
    categories: 6
    authority-scope: content
    
  - tier: devops
    name: "DevOps Tier"
    description: "Deployment automation, observability, environment management, CI/CD orchestration"
    priority: 4
    categories: 4
    authority-scope: content

  - tier: application
    name: "Application Tier"
    description: "Application-level specifications (individual applications using upstream specs)"
    priority: 5
    categories: null
    authority-scope: content

# Override mechanism: emergency changes that bypass normal cascade
override-policy:
  allowed: true
  requires:
    - declared-role: platform
    - authority-scope: platform-meta-governance
    - justification: "Mandatory written justification citing emergency condition"
    - audit-entry: "Override must be logged with timestamp, actor, justification, and affected specs"
  note: "Only platform-meta-governance authority can invoke emergency overrides. All overrides are auditable and time-limited."

# Category tree structure
categories:
  business:
    cost:
      spec-id: cost-001
      version: "1.0.0"
      file: business/cost/spec.md
      description: "Cost optimization and budget targets"
      
    governance:
      spec-id: gov-001
      version: "1.0.0-draft"
      file: business/governance/spec.md
      description: "Approval workflows, SLAs, and governance processes"
      
    compliance-framework:
      spec-id: comp-001
      version: "1.0.0-draft"
      file: business/compliance-framework/spec.md
      description: "Regulatory and compliance requirements (NIST, etc.)"
      
  security:
    access-control:
      spec-id: ac-001
      version: "1.0.0-draft"
      file: security/access-control/spec.md
      description: "Authentication, authorization, and RBAC"
      
    data-protection:
      spec-id: dp-001
      version: "1.0.0"
      file: security/data-protection/spec.md
      description: "Encryption, keys, and confidentiality"
      
    audit-logging:
      spec-id: audit-001
      version: "1.0.0-draft"
      file: security/audit-logging/spec.md
      description: "Audit trails, monitoring, and logging"
      
  infrastructure:
    compute:
      spec-id: compute-001
      version: "1.0.0"
      file: infrastructure/compute/spec.md
      description: "VM SKUs, autoscaling, and compute resources"
      
    networking:
      spec-id: net-001
      version: "1.0.0-draft"
      file: infrastructure/networking/spec.md
      description: "VNets, NSGs, load balancing, and connectivity"
      
    storage:
      spec-id: stor-001
      version: "1.0.0-draft"
      file: infrastructure/storage/spec.md
      description: "Disk types, replication, and backup"
      
    cicd-pipeline:
      spec-id: cicd-001
      version: "1.0.0-draft"
      file: infrastructure/cicd-pipeline/spec.md
      description: "Deployment automation, testing, and validation"
      
    iac-modules:
      spec-id: iac-001
      version: "1.0.0"
      file: infrastructure/iac-modules/spec.md
      description: "Centralized reusable Bicep wrapper modules based on AVM"
      
  platform:
    artifact-org:
      spec-id: artifact-001
      version: "1.0.0"
      file: platform/artifact-org/spec.md
      description: "Artifact repository organization and structure"
      
    iac-linting:
      spec-id: lint-001
      version: "1.0.0-draft"
      file: platform/iac-linting/spec.md
      description: "IaC code quality and linting standards"
      
    policy-as-code:
      spec-id: pac-001
      version: "1.0.0-draft"
      file: platform/policy-as-code/spec.md
      description: "Azure Policy and governance automation"
      
    spec-system:
      spec-id: spec-001
      version: "1.0.0-draft"
      file: platform/spec-system/spec.md
      description: "Meta-specifications for spec format and system"

  devops:
    deployment-automation:
      spec-id: deploy-001
      version: "1.0.0-placeholder"
      file: devops/deployment-automation/spec.md
      description: "Deployment patterns, blue-green, canary, rollback strategies"

    observability:
      spec-id: obs-001
      version: "1.0.0-placeholder"
      file: devops/observability/spec.md
      description: "Logging, metrics, tracing, alerting, SLI/SLO definitions"

    environment-management:
      spec-id: env-001
      version: "1.0.0-placeholder"
      file: devops/environment-management/spec.md
      description: "Environment definitions, configuration management, secrets management"

    ci-cd-orchestration:
      spec-id: cicd-orch-001
      version: "1.0.0-placeholder"
      file: devops/ci-cd-orchestration/spec.md
      description: "CI/CD workflow orchestration, build and deployment pipelines"

# Precedence rules (tier-level primary, category-level secondary)
# Must mirror the canonical tier hierarchy defined in the tiers section above.
precedence:
  tier-order:
    - platform       # 0 — foundational, defines the spec system itself
    - business       # 1 — cost, governance, compliance
    - security       # 2 — access control, data protection, audit
    - infrastructure # 3 — compute, networking, storage, IaC
    - devops         # 4 — deployment, observability, environments, CI/CD orchestration
    - application    # 5 — individual application specs (lowest precedence)

  # Category-level precedence within tiers
  category-rules:
    platform:
      order: [spec-system, iac-linting, artifact-org, policy-as-code]
      rationale: "Spec-System (meta) ≈ IaC-Linting (technical standard) > Artifact-Org (structural) > Policy-as-Code (reactive)"

    business:
      order: [compliance-framework, governance, cost]
      rationale: "Compliance (regulatory) > Governance (approval) > Cost (optimization)"

    security:
      order: [data-protection, access-control, audit-logging]
      rationale: "Data Protection (confidentiality) ≥ Access Control (foundation) > Audit (detection)"
      connection: "DP and AC roughly equal in priority, both above audit"

    infrastructure:
      order: [compute, storage, networking, cicd-pipeline, iac-modules]
      rationale: "Compute (workload-driven) > Storage (depends on workload) > Networking (independent) > CI/CD > IaC"
      workload-note: "For latency-sensitive workloads, networking may dominate; tier dynamically"

    devops:
      order: [observability, deployment-automation, environment-management, ci-cd-orchestration]
      rationale: "Observability (detect issues first) > Deployment (ship safely) > Environments (config) > CI/CD Orchestration (pipeline glue)"

# Formalized conflicts and resolution rules
conflicts:
  - id: conflict-001
    name: "Cost vs Compute"
    description: "Business cost targets vs infrastructure performance preferences"
    affected-specs: [cost-001, compute-001]
    winner: cost-001
    rationale: "Business budget constrains infrastructure design"
    
  - id: conflict-002
    name: "Cost vs Data-Protection"
    description: "Business cost optimization vs security encryption/HSM requirements"
    affected-specs: [cost-001, dp-001]
    winner: dp-001
    rationale: "Security wins; encryption is non-negotiable"
    
  - id: conflict-003
    name: "Governance vs CI/CD"
    description: "Business approval gates vs infrastructure automation"
    affected-specs: [gov-001, cicd-001]
    winner: gov-001
    rationale: "Production requires approval gates; dev can auto-deploy"
    
  - id: conflict-004
    name: "Compliance vs Storage Cost"
    description: "Business compliance vs infrastructure storage costs"
    affected-specs: [comp-001, stor-001]
    winner: comp-001
    rationale: "Regulatory requirements bind infrastructure decisions"
    
  - id: conflict-005
    name: "Access-Control vs Governance"
    description: "Security access control vs business governance processes"
    affected-specs: [ac-001, gov-001]
    winner: ac-001
    rationale: "Access control is foundational; governance includes break-glass exceptions"
    
  - id: conflict-006
    name: "Compute vs Storage"
    description: "Infrastructure compute SKUs vs storage tier decisions"
    affected-specs: [compute-001, stor-001]
    winner: compute-001
    rationale: "Workload characteristics determine storage tier"
    
  - id: conflict-007
    name: "Cost vs Networking"
    description: "Business cost optimization vs infrastructure availability/networking"
    affected-specs: [cost-001, net-001]
    winner: "dual-gate: cost + business SLA"
    rationale: "Availability target (from business SLA) drives network design within cost constraints"

  - id: conflict-008
    name: "Observability vs Cost"
    description: "DevOps observability requirements (logging, tracing, metrics retention) vs business cost targets"
    affected-specs: [obs-001, cost-001]
    winner: cost-001
    rationale: "Business cost constraints cap observability scope; minimum viable observability defined by SLA requirements"

  - id: conflict-009
    name: "Deployment-Automation vs Governance"
    description: "DevOps deployment automation (continuous deployment, fast rollouts) vs business governance approval gates"
    affected-specs: [deploy-001, gov-001]
    winner: gov-001
    rationale: "Production deployments require governance approval gates; non-production environments may auto-deploy"

# Validation schema requirements
validation:
  required-frontmatter-fields:
    - tier
    - category
    - spec-id
    - version
    - description
    
  version-format: "semver with -draft|-alpha|-beta|-rc suffixes"
  
  dependencies:
    validation: "Directed acyclic graph; cycles not allowed"
    resolution: "All upstream dependencies must be satisfied before downstream use"
    
  references:
    all-specs: "Referenced specs must exist in specs.yaml"
    circular-deps: "Circular dependencies detected and rejected"

# Application registry
# Application lifecycle metadata is managed exclusively in specs/application/_index.yaml.
# This section is a pointer only — do not duplicate app entries here.
applications:
  registry-file: application/_index.yaml
  note: "All application registrations, lifecycle states, and retirement metadata live in the registry file only."
