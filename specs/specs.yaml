# Precedence rules (tier-level primary, category-level secondary)
# Must mirror the canonical tier hierarchy defined in the tiers section above.
precedence:
  tier-order:
    - platform       # 0 — foundational, defines the spec system itself
    - business       # 1 — cost, governance, compliance
    - security       # 2 — access control, data protection, audit
    - infrastructure # 3 — compute, networking, storage, IaC
    - devops         # 4 — deployment, observability, environments, CI/CD orchestration
    - application    # 5 — individual application specs (lowest precedence)

  # Category-level precedence within tiers
  category-rules:
    platform:
      order: [spec-system, iac-linting, artifact-org, policy-as-code]
      rationale: "Spec-System (meta) ≈ IaC-Linting (technical standard) > Artifact-Org (structural) > Policy-as-Code (reactive)"

    business:
      order: [compliance-framework, governance, cost]
      rationale: "Compliance (regulatory) > Governance (approval) > Cost (optimization)"

    security:
      order: [data-protection, access-control, audit-logging]
      rationale: "Data Protection (confidentiality) ≥ Access Control (foundation) > Audit (detection)"
      connection: "DP and AC roughly equal in priority, both above audit"

    infrastructure:
      order: [compute, storage, networking, cicd-pipeline, iac-modules]
      rationale: "Compute (workload-driven) > Storage (depends on workload) > Networking (independent) > CI/CD > IaC"
      workload-note: "For latency-sensitive workloads, networking may dominate; tier dynamically"

    devops:
      order: [observability, deployment-automation, environment-management, ci-cd-orchestration]
      rationale: "Observability (detect issues first) > Deployment (ship safely) > Environments (config) > CI/CD Orchestration (pipeline glue)"

# Formalized conflicts and resolution rules
conflicts:
  - id: conflict-001
    name: "Cost vs Compute"
    description: "Business cost targets vs infrastructure performance preferences"
    affected-specs: [cost, compute]
    winner: cost
    rationale: "Business budget constrains infrastructure design"
    
  - id: conflict-002
    name: "Cost vs Data-Protection"
    description: "Business cost optimization vs security encryption/HSM requirements"
    affected-specs: [cost, dp]
    winner: dp
    rationale: "Security wins; encryption is non-negotiable"
    
  - id: conflict-003
    name: "Governance vs CI/CD"
    description: "Business approval gates vs infrastructure automation"
    affected-specs: [gov, cicd]
    winner: gov
    rationale: "Production requires approval gates; dev can auto-deploy"
    
  - id: conflict-004
    name: "Compliance vs Storage Cost"
    description: "Business compliance vs infrastructure storage costs"
    affected-specs: [comp, stor]
    winner: comp
    rationale: "Regulatory requirements bind infrastructure decisions"
    
  - id: conflict-005
    name: "Access-Control vs Governance"
    description: "Security access control vs business governance processes"
    affected-specs: [ac, gov]
    winner: ac
    rationale: "Access control is foundational; governance includes break-glass exceptions"
    
  - id: conflict-006
    name: "Compute vs Storage"
    description: "Infrastructure compute SKUs vs storage tier decisions"
    affected-specs: [compute, stor]
    winner: compute
    rationale: "Workload characteristics determine storage tier"
    
  - id: conflict-007
    name: "Cost vs Networking"
    description: "Business cost optimization vs infrastructure availability/networking"
    affected-specs: [cost, net]
    winner: "dual-gate: cost + business SLA"
    rationale: "Availability target (from business SLA) drives network design within cost constraints"

  - id: conflict-008
    name: "Observability vs Cost"
    description: "DevOps observability requirements (logging, tracing, metrics retention) vs business cost targets"
    affected-specs: [obs, cost]
    winner: cost
    rationale: "Business cost constraints cap observability scope; minimum viable observability defined by SLA requirements"

  - id: conflict-009
    name: "Deployment-Automation vs Governance"
    description: "DevOps deployment automation (continuous deployment, fast rollouts) vs business governance approval gates"
    affected-specs: [deploy, gov]
    winner: gov
    rationale: "Production deployments require governance approval gates; non-production environments may auto-deploy"

# Validation schema requirements
validation:
  required-frontmatter-fields:
    - tier
    - category
    - spec-id
    - version
    - description

  # Role context metadata — required on all specs, plans, and tasks (per Section 4 governance)
  # Proves who made the change, under what authority, and against which upstream constraints.
  role-context:
    required-fields:
      - declared-role       # platform | business | security | infrastructure | devops | application
      - authority-scope     # platform-meta-governance | platform-content-standards | content
      - change-intent       # Brief description of what this change aims to achieve
    optional-fields:
      - upstream-snapshot   # Array of {spec-id, version} pinned at decision time for reproducibility
      - cascade-run-id      # Populated by automation when a cascade is triggered
      - decision-mode       # autonomous | reviewed | approved
      - requested-by        # Author or system that initiated the change
      - approved-by         # Reviewer who approved (recommended for production-impacting changes)
    valid-declared-roles:
      - platform
      - business
      - security
      - infrastructure
      - devops
      - application
    valid-authority-scopes:
      - platform-meta-governance
      - platform-content-standards
      - content
    valid-decision-modes:
      - autonomous    # No human review required (e.g., automated scaffolding)
      - reviewed      # Human reviewed but no formal approval gate
      - approved      # Formal approval required (e.g., production-impacting changes)
    upstream-snapshot-format:
      note: "Explicit version map — each entry is a {spec-id, version} pair"
      example:
        - spec-id: cost
          version: "2.0.0"
        - spec-id: dp
          version: "1.0.0"
    
  version-format: "semver with -draft|-alpha|-beta|-rc suffixes"

  # ============================================================================
  # VERSION COMPLIANCE SCHEMA
  #
  # Governs how downstream specs track and upgrade their compliance with upstream
  # spec versions. Enables a structured upgrade path when upstream specs change.
  #
  # Example: iac-modules 1.2.0 is compliant with cost 2.5.0.
  #          cost releases 3.0.0.
  #          iac-modules compliance-state becomes "lagging".
  #          When iac-modules upgrades to 1.3.0 (adopting cost 3.0.0),
  #          compliance-state returns to "current".
  # ============================================================================
  version-compliance:
    note: "The 'version' field in the categories map is the authoritative latest published version per spec-id."

    depends-on-version:
      required: true
      meaning: "The upstream spec version this spec was written to comply with. Must be pinned — not a range."

    compliance-state:
      required: true
      values:
        current: "Compliant with the latest published version of all upstream specs"
        lagging: "One or more upstream specs have newer versions; upgrade not yet started"
        pending-upgrade: "Upgrade in progress; see upgrade-path for target versions and timeline"

    upgrade-path:
      required-when: "compliance-state is 'lagging' or 'pending-upgrade'"
      meaning: "Documents the planned upgrade for each lagging upstream dependency"
      fields:
        - spec-id: "Upstream spec-id being upgraded toward"
        - compliant-with-version: "Version this spec is currently pinned to"
        - target-version: "Version being upgraded to"
        - planned-date: "ISO date (optional)"
        - notes: "Additional context (optional)"

    semver-drift-policy:
      major-version-bump: "ERROR — breaking change; downstream MUST upgrade to remain compliant"
      minor-version-bump: "WARNING — additive change; downstream SHOULD upgrade"
      patch-version-bump: "INFO — fix only; downstream may pick up opportunistically"
      note: "semver IS the breaking-change flag. Major bump = breaking by definition. No separate field needed."

  version-history:
    note: >
      Every spec carries an in-file version-history block recording each published version.
      Each entry with a `git-tag` field is resolvable from git history.
      Entries without a `git-tag` predate the tagging system and are not resolvable by tag.
    required: true
    entry-fields:
      version:   "Semver string matching the version that was published (required)"
      date:      "ISO-8601 date the version was published (required)"
      git-tag:   "Git tag name in the form spec/<spec-id>/<version> (required for versions published after this system was established)"
      summary:   "Human-readable description of changes. For major bumps, describe what broke and why. (required)"
    git-tag-convention:
      format: "spec/<spec-id>/<version>"
      examples:
        - "spec/cost/2.0.0"
        - "spec/compute/2.0.0"
        - "spec/lint/1.0.0-draft"
      create: "git tag spec/<spec-id>/<version>  # run once when bumping version, before push"
      resolve: "git show spec/<spec-id>/<version>:specs/<tier>/<category>/spec.md"
      note: >
        Tags point to commits, not individual files. Multiple spec tags may share a commit
        (when two specs are bumped together). The tag name encodes spec-id and version;
        the spec file path is always stable, so git show reliably retrieves any historical version.
    validation-rules:
      - "Every version listed in depends-on[].version must have a resolvable git tag"
      - "Every version-history entry with a git-tag field must have a matching tag in git"
      - "The current spec version must appear as the first entry in version-history"
      - "Entries must be in descending version order (newest first)"

  dependencies:
    validation: "Directed acyclic graph; cycles not allowed"
    resolution: "All upstream dependencies must be satisfied before downstream use"
    
  references:
    all-specs: "Referenced specs must exist in specs.yaml"
    circular-deps: "Circular dependencies detected and rejected"

# Application registry
# Application lifecycle metadata is managed exclusively in specs/application/_index.yaml.
# This section is a pointer only — do not duplicate app entries here.
applications:
  registry-file: application/_index.yaml
  note: "All application registrations, lifecycle states, and retirement metadata live in the registry file only."